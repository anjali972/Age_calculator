<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h4 class="base"><u>Age Calculator</u></h4>
    
        <div class="block">
            <label for="date" class="title">Date:</label>
            <input type="number" id="date" placeholder="DD">
        </div>
        <div class="block">
            <label for="month" class="title">Month:</label>
            <input type="number" id="month" placeholder="MM">
        </div>
        <div class="block">
            <label for="year" class="title">Year:</label>
            <input type="number" id="year" placeholder="YYYY">
        </div>
        <button class="submit-button" onclick="age()">Calculate Age</button>
        <div id="age"></div>
    </div>
    <script src="script.js"></script>
</body>
